[package]
name = "riscv-instruction-scanner"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CSV catalog exporter and project scanner for the RISC-V instruction crates"

[[bin]]
name = "riscv-scan"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
riscv-instruction-schema = { path = "../riscv-instruction-schema" }
csv = "1.3"
walkdir = "2.5"
globset = "0.4"

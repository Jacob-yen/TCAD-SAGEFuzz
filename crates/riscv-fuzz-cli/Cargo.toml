[package]
name = "riscv_fuzz_test"
version = "0.1.0"
edition = "2024"

[features]
default = []
integration-tests = []

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
log = "0.4.29"
once_cell = "1.21.3"
rand = "0.9.2"
regex = "1.12.2"
riscv-instruction.workspace = true
riscv-instruction-types.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.17"
toml = "0.9.8"
env_logger = "0.11.8"

riscv-fuzz-config = { path = "../riscv-fuzz-config" }
riscv-fuzz-plugin-api = { path = "../riscv-fuzz-plugin-api" }
riscv-fuzz-plugin-manager = { path = "../riscv-fuzz-plugin-manager" }
riscv-fuzz-toolchain = { path = "../riscv-fuzz-toolchain" }
riscv-fuzz-diff = { path = "../riscv-fuzz-diff" }
riscv-fuzz-testcase-engine = { path = "../riscv-fuzz-testcase-engine" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.24.0"
which = "8.0.0"

[package]
name = "riscv-fuzz-plugin-api"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bincode = { workspace = true }
clap = { version = "4.5.54", features = ["derive"] }
libc = "0.2.177"
once_cell = "1.21.3"
prost = "0.14.1"
regex = "1.12.2"
riscv-instruction.workspace = true
riscv-instruction-types.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_plain = "1.0.2"
thiserror = "2.0.17"

[build-dependencies]
prost-build = "0.14.1"
protoc-bin-vendored = "3.2.0"

[workspace]
members = [
  "crates/riscv-fuzz-cli",
  "crates/riscv-fuzz-config",
  "crates/riscv-fuzz-diff",
  "crates/riscv-fuzz-plugin-api",
  "crates/riscv-fuzz-plugin-manager",
  "crates/riscv-fuzz-testcase-engine",
  "crates/riscv-fuzz-toolchain",
  "crates/plugins/riscv-fuzz-core-spike",
  "crates/plugins/riscv-fuzz-core-ara",
  "crates/plugins/riscv-fuzz-core-xiangshan",
]
default-members = ["crates/riscv-fuzz-cli"]
resolver = "3"

[workspace.package]
authors = ["canxin121"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/canxin121/riscv-instruction-crates"
homepage = "https://github.com/canxin121/riscv-instruction-crates"
description = "RISC-V instruction assembly library"

[workspace.dependencies]
riscv-instruction = { path = "third_party/riscv-instruction-crates/riscv-instruction" }
riscv-instruction-types = { path = "third_party/riscv-instruction-crates/riscv-instruction-types" }
bincode = { version = "2", features = ["serde"] }
syn = { version = "2.0.113", features = ["full"] }
quote = "1.0.42"
proc-macro2 = "1.0.104"
heck = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
rand = "0.9.2"
chrono = "0.4.42"
serde_yaml = "0.9.34-deprecated"
enum-iterator = "2.3.0"
regex = "1.12.2"
